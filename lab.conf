LAB_NAME="Firewall_DMZ_Seguranca"
LAB_DESCRIPTION="Cyber Range: firewall de perimetro, DMZ, L2/L3/L4 e Defense in Depth"
LAB_VERSION="2.0"

# Topologia da figura: Internet -- r0 -- fw -- LAN/DMZ/MGMT
# r0/eth0 = WAN interna 198.51.100.2/30 (gateway do fw)
# r0/eth1 = interface adicional criada por bridged=true, ligada à rede do host via NAT.
r0[0]="WAN_FW"
r0[bridged]="true"
# Facilita o teste Internet -> Web a partir do host: http://localhost:8080
r0[port]="8080:80/tcp"

# Firewall: eth0 WAN, eth1 LAN, eth2 DMZ, eth3 MGMT.
fw[0]="WAN_FW"
fw[1]="LAN"
fw[2]="DMZ"
fw[3]="MGMT"

# MACs fixos na LAN para tornar o experimento L2 reproduzível.
pc1[0]="LAN/02:42:0a:00:01:0a"
pc2[0]="LAN/02:42:0a:00:01:0b"

web[0]="DMZ"
dns[0]="DMZ"

# Rede de gerenciamento opcional, mantida porque já fazia parte da entrega.
adm[0]="MGMT"
